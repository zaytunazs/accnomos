name: Deploy web (static export) to the site branch

on:
  push:
    branches: [main]
    paths: ["apps/web/**", ".github/workflows/deploy-web.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      # Public client id (not a secret) and the public runtime + HMRC relay URLs used by the hosted PWA.
      NEXT_PUBLIC_MS_CLIENT_ID: ${{ vars.MS_CLIENT_ID || 'f88eccde-6ec2-4302-b47b-e1844deba2e1' }}
      NEXT_PUBLIC_MS_AUTHORITY: https://login.microsoftonline.com/common
      NEXT_PUBLIC_RUNTIME_URL: https://api.accnomos.com
      NEXT_PUBLIC_RELAY_URL: https://api.accnomos.com
      NEXT_PUBLIC_TEST_MODE: "" # the fake sign-in (src/lib/msal-test.ts) is for e2e builds only
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm lint && pnpm build
        working-directory: apps/web
      - name: Refuse to publish a test-mode build
        working-directory: apps/web
        run: |
          if grep -rlE '__test/(graph|ai)|accnomos-test\.signedIn' out/; then
            echo "::error::out/ contains test-mode code (fake sign-in or /__test URLs); not publishing"; exit 1
          fi
      - name: Publish out/ to the site branch (Plesk Git pulls this branch into httpdocs)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/web/out
          publish_branch: site
          force_orphan: true
          cname: accnomos.com
          commit_message: "site: ${{ github.sha }}"
