name: End-to-end tests (Playwright, test mode)

# The test-mode static export (fake Microsoft sign-in) against the runtime with ACCNOMOS_TEST_MODE=1
# (in-memory OneDrive/Outlook/calendar, stub AI answering from evals/gold). No secrets; nothing leaves the runner.
on:
  pull_request:
    paths: ["apps/web/**", "services/runtime/**", "packages/**", "evals/gold/**", "evals/harness/render.py", ".github/workflows/e2e.yml"]
  push:
    branches: [main]
    paths: ["apps/web/**", "services/runtime/**", "packages/**", "evals/gold/**", "evals/harness/render.py", ".github/workflows/e2e.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 8 # budget: under 4 minutes warm (caches below), the rest is headroom for a cold cache
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install the runtime (uv workspace)
        run: uv sync --frozen --package accnomos-runtime
        working-directory: .

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json # its packageManager pins the version; no second one here
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: Playwright version (browser cache key)
        id: pw
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium-shell
      - name: Install Chromium for Playwright (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Install Chromium's system libraries (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Cache the Next build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-e2e-${{ runner.os }}-${{ hashFiles('apps/web/pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**', 'apps/web/next.config.ts') }}
          restore-keys: next-e2e-${{ runner.os }}-${{ hashFiles('apps/web/pnpm-lock.yaml') }}-
      - name: Build the test-mode export (out-e2e/)
        run: pnpm run e2e:build

      - name: Run Playwright (starts the runtime in test mode and serves out-e2e/)
        timeout-minutes: 4
        run: pnpm run e2e:test
        env:
          CI: "1"
          E2E_PYTHON: ${{ github.workspace }}/.venv/bin/python

      - name: Upload traces and report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 14
