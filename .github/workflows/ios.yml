name: iOS

# iOS builds on a GitHub-hosted Mac (docs/IOS_APP_STORE.md, "CI").
#
# * build (unsigned): every pull request that touches the Flutter app, and on demand. `flutter build ios
#   --no-codesign` catches iOS-only breakage (plugins, Swift, Info.plist) without any Apple secrets.
# * testflight (signed): manual dispatch with upload=true, or a pushed tag `ios-*`. Imports the distribution
#   certificate and App Store provisioning profile into a throwaway keychain, builds the IPA with
#   `flutter build ipa`, and uploads it to TestFlight with `xcrun altool` and an App Store Connect API key.
#
# Cost: on a private repository GitHub bills macOS minutes at roughly ten times the Linux rate
# ($0.062 vs $0.006 a minute, Nov 2026); public repositories run standard runners free. Codemagic's free
# 500 macOS minutes a month is the documented alternative.
#
# Secrets (Settings > Secrets and variables > Actions), only for the testflight job:
#   IOS_DIST_CERT_P12_BASE64    Apple Distribution certificate + private key, .p12, base64
#   IOS_DIST_CERT_PASSWORD      the .p12 export password
#   IOS_PROFILE_BASE64          App Store provisioning profile for com.accnomos.app, base64
#   APPLE_TEAM_ID               10-character Team ID
#   ASC_KEY_ID                  App Store Connect API key id (role: App Manager)
#   ASC_ISSUER_ID               App Store Connect API issuer id
#   ASC_KEY_P8_BASE64           the AuthKey_<id>.p8 file, base64
# Variables (public configuration, not secrets), optional:
#   GOOGLE_SERVER_CLIENT_ID, GOOGLE_IOS_CLIENT_ID, GOOGLE_IOS_REVERSED_CLIENT_ID
#   Without them the build ships with "Continue with Google" hidden; Microsoft sign-in and the demo work.

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/ios.yml"
  push:
    tags:
      - "ios-*"
  workflow_dispatch:
    inputs:
      upload:
        description: "Sign and upload to TestFlight (needs the signing secrets)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.8 # same as ci.yml's flutter job

defaults:
  run:
    working-directory: apps/mobile

jobs:
  build:
    name: build (unsigned)
    if: github.event_name != 'push'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable # App Store uploads need Xcode 26+ since 28 Apr 2026
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --release --no-codesign

  testflight:
    name: testflight (signed)
    if: startsWith(github.ref, 'refs/tags/ios-') || (github.event_name == 'workflow_dispatch' && inputs.upload)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Check the signing secrets are set
        env:
          P12: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY: ${{ secrets.ASC_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          missing=""
          for v in P12 PROFILE TEAM KEY KEY_ID ISSUER; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing iOS signing secrets:$missing (docs/IOS_APP_STORE.md, 'CI')"
            exit 1
          fi

      # GitHub's documented route: a temporary keychain that is deleted at the end of the job.
      - name: Install the certificate and provisioning profile
        env:
          P12: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/accnomos-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/dist.p12"

          security cms -D -i "$RUNNER_TEMP/app.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$RUNNER_TEMP/app.mobileprovision" "$dir/$UUID.mobileprovision"
          done

          # Manual signing for the Release build only (Release.xcconfig includes this file if present;
          # it is git-ignored). Local Xcode builds keep automatic signing.
          cat > ios/Flutter/Signing.xcconfig <<EOF
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = $TEAM
          CODE_SIGN_IDENTITY = Apple Distribution
          CODE_SIGN_IDENTITY[sdk=iphoneos*] = Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER = $NAME
          EOF

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>com.accnomos.app</key><string>$NAME</string></dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Google Sign-In ids (public configuration)
        if: vars.GOOGLE_IOS_CLIENT_ID != ''
        env:
          IOS_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
          IOS_REVERSED: ${{ vars.GOOGLE_IOS_REVERSED_CLIENT_ID }}
          SERVER_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          cat > ios/Flutter/GoogleSignIn.xcconfig <<EOF
          GOOGLE_IOS_CLIENT_ID = $IOS_ID
          GOOGLE_IOS_REVERSED_CLIENT_ID = $IOS_REVERSED
          GOOGLE_SERVER_CLIENT_ID = $SERVER_ID
          EOF

      - run: flutter pub get --enforce-lockfile

      - name: Build the IPA
        env:
          SERVER_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID }}
          IOS_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
        run: |
          # App Store build numbers must only go up: offset past every Android/manual build so far.
          BUILD_NUMBER=$((1000 + ${{ github.run_number }}))
          DEFINES=()
          if [ -n "$SERVER_ID" ] && [ -n "$IOS_ID" ]; then
            DEFINES+=(--dart-define=GOOGLE_SERVER_CLIENT_ID="$SERVER_ID" --dart-define=GOOGLE_IOS_CLIENT_ID="$IOS_ID")
          fi
          flutter build ipa --release \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist" \
            "${DEFINES[@]}"
          ls -l build/ios/ipa

      - name: Upload to TestFlight
        env:
          KEY: ${{ secrets.ASC_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$KEY" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8"
          IPA=$(ls build/ios/ipa/*.ipa | head -n 1)
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER"

      - name: Keep the IPA (14 days)
        uses: actions/upload-artifact@v7
        with:
          name: accnomos-ios-ipa
          path: apps/mobile/build/ios/ipa/*.ipa
          retention-days: 14

      - name: Remove the keychain and key
        if: always()
        run: |
          [ -n "$KEYCHAIN" ] && security delete-keychain "$KEYCHAIN" || true
          rm -rf "$HOME/.appstoreconnect/private_keys" ios/Flutter/Signing.xcconfig
