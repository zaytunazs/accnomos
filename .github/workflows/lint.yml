name: Lint and types (ruff, pyright, eslint, tsc)

# Fast static checks only; tests run in their own workflows. Two parallel jobs, each well under 2 minutes warm.
# Run the same locally: see docs/DEV.md ("Lint and type checks").
on:
  pull_request:
    paths: ["**.py", "pyproject.toml", "uv.lock", "apps/web/**", ".github/workflows/lint.yml"]
  push:
    branches: [main]
    paths: ["**.py", "pyproject.toml", "uv.lock", "apps/web/**", ".github/workflows/lint.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: ruff check
        run: uvx ruff@0.17.3 check --output-format github .
      - name: ruff format --check
        run: uvx ruff@0.17.3 format --check .
      # pyright resolves imports against the runtime's installed dependencies (ledger and connectors come with it)
      - name: Install the runtime (uv workspace)
        run: uv sync --frozen --package accnomos-runtime
      - name: pyright (basic; scope in pyproject.toml)
        run: uvx pyright@1.1.414 --pythonpath .venv/bin/python

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: eslint
        run: pnpm run lint
      - name: tsc --noEmit
        run: pnpm exec tsc --noEmit
