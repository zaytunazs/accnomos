name: accnomos_mobile
description: "Accnomos - bookkeeping and VAT for UK small businesses. Your books stay in your own cloud. Meta AI does the work."
publish_to: 'none'
version: 0.3.5+10

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  image_picker: ^1.1.2
  msal_auth: ^3.5.3
  record: ^7.1.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/msal_config.json
