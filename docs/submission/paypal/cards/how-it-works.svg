<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <!-- Scene hw (about 6 s): how Accnomos works with PayPal. Static card; no logos, PayPal named as text only.
       Render: see cards/README.md. Colours are the app's own tokens (apps/web/src/app/globals.css). -->
  <rect width="1920" height="1080" fill="#f8f6f3"/>
  <text x="960" y="130" text-anchor="middle" font-size="64" font-weight="800" fill="#1f1a16">How it works</text>
  <text x="960" y="190" text-anchor="middle" font-size="30" fill="#5c534b">Every PayPal figure reaches your books only after you approve it</text>

  <!-- 1 PayPal APIs -->
  <g transform="translate(70,300)">
    <rect width="390" height="470" rx="18" fill="#ffffff" stroke="#e6ded4" stroke-width="3"/>
    <text x="195" y="70" text-anchor="middle" font-size="40" font-weight="800" fill="#175c86">PayPal APIs</text>
    <g font-size="29" fill="#1f1a16">
      <text x="40" y="150">Invoicing v2</text>
      <text x="40" y="215">Transaction Search</text>
      <text x="40" y="280">Balances</text>
      <text x="40" y="345">Payouts</text>
      <text x="40" y="410">Disputes</text>
    </g>
  </g>
  <!-- arrows -->
  <g fill="#5a2d00">
    <path d="M478 535 h42 v-18 l34 30 l-34 30 v-18 h-42 z"/>
    <path d="M908 535 h42 v-18 l34 30 l-34 30 v-18 h-42 z"/>
    <path d="M1338 535 h42 v-18 l34 30 l-34 30 v-18 h-42 z"/>
  </g>
  <!-- 2 AI proposes -->
  <g transform="translate(570,380)">
    <rect width="320" height="310" rx="18" fill="#f4ede5" stroke="#e6ded4" stroke-width="3"/>
    <text x="160" y="120" text-anchor="middle" font-size="38" font-weight="800" fill="#5a2d00">AI proposes</text>
    <text x="160" y="180" text-anchor="middle" font-size="26" fill="#5c534b">matches, codes,</text>
    <text x="160" y="216" text-anchor="middle" font-size="26" fill="#5c534b">explains</text>
  </g>
  <!-- 3 Code calculates -->
  <g transform="translate(1000,380)">
    <rect width="320" height="310" rx="18" fill="#f4ede5" stroke="#e6ded4" stroke-width="3"/>
    <text x="160" y="120" text-anchor="middle" font-size="38" font-weight="800" fill="#5a2d00">Code calculates</text>
    <text x="160" y="180" text-anchor="middle" font-size="26" fill="#5c534b">gross, fee, net, VAT</text>
    <text x="160" y="216" text-anchor="middle" font-size="26" fill="#5c534b">in pence</text>
  </g>
  <!-- 4 Owner approves -->
  <g transform="translate(1430,380)">
    <rect width="420" height="310" rx="18" fill="#5a2d00"/>
    <text x="210" y="120" text-anchor="middle" font-size="44" font-weight="800" fill="#ffffff">You approve</text>
    <text x="210" y="180" text-anchor="middle" font-size="26" fill="#f4ede5">every posting,</text>
    <text x="210" y="216" text-anchor="middle" font-size="26" fill="#f4ede5">every payout</text>
  </g>
  <!-- down to outputs -->
  <path d="M1622 708 v52 h-18 l36 34 l36 -34 h-18 v-52 z" fill="#5a2d00" transform="translate(-18,0)"/>
  <g transform="translate(980,820)">
    <rect width="420" height="150" rx="18" fill="#ffffff" stroke="#e6ded4" stroke-width="3"/>
    <text x="210" y="68" text-anchor="middle" font-size="34" font-weight="800" fill="#1f1a16">Books in your own drive</text>
    <text x="210" y="112" text-anchor="middle" font-size="25" fill="#5c534b">OneDrive or Google Drive</text>
  </g>
  <g transform="translate(1430,820)">
    <rect width="420" height="150" rx="18" fill="#ffffff" stroke="#e6ded4" stroke-width="3"/>
    <text x="210" y="68" text-anchor="middle" font-size="34" font-weight="800" fill="#1f1a16">VAT to HMRC</text>
    <text x="210" y="112" text-anchor="middle" font-size="25" fill="#5c534b">Making Tax Digital (sandbox here)</text>
  </g>
  <text x="70" y="1040" font-size="24" fill="#5c534b">Recorded against PayPal's sandbox. No real money moved.</text>
</svg>
