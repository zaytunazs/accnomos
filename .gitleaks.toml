# gitleaks configuration: the default rules, minus three known test fixtures (see docs/reviews/security-3/REVIEW.md).
# Run: gitleaks git --redact -v .
[extend]
useDefault = true

[allowlist]
description = "Fake credentials used by the log-scrubbing tests, and a curl example in a review"
regexTarget = "line"
regexes = [
  '''eyJhbGciOiJSUzI1NiJ9\.eyJzdWIiOiJ1c2VyIn0\.c2lnbmF0dXJl''',
  '''mk-live-123456''',
  '''curl -i localhost:8780/health''',
]
