[project]
name = "accnomos-workspace"
version = "0.1.0"
description = "Accnomos monorepo (Python side): runtime, HMRC relay, ledger, connectors, evals"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["services/runtime", "services/hmrc-relay", "packages/ledger", "packages/connectors", "evals"]

[tool.uv.sources]
accnomos-ledger = { workspace = true }
accnomos-connectors = { workspace = true }
accnomos-runtime = { workspace = true }

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["evals/runs", "**/node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are meant to be called in defaults; VatCycle is a frozen dataclass.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query", "app.vat_cycle.VatCycle"]

[tool.ruff.lint.per-file-ignores]
# conftest.py puts this checkout's sources on sys.path before importing them, so imports cannot all be at the top.
"**/conftest.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app", "relay", "accnomos_ledger", "accnomos_connectors", "harness"]

[tool.pytest.ini_options]
testpaths = ["packages", "services", "evals"]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
