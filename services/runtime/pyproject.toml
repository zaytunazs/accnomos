[project]
name = "accnomos-runtime"
version = "0.1.0"
description = "Stateless Agent Runtime: receives the user's storage token + AI config per request, orchestrates Meta models, persists nothing"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "python-multipart>=0.0.9",
  "openpyxl>=3.1",
  "pillow>=10",
  "numpy>=1.26",
  "fpdf2>=2.8",
  "pypdfium2>=4.30",  # reads PDFs: text per page and a render of page 1 (app/formats.py); bundles PDFium
  "pillow-heif>=0.18",  # iPhone HEIC/HEIF photos to JPEG; bundles libheif
  "accnomos-ledger",
  "accnomos-connectors",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
