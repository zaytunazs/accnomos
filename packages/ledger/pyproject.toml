[project]
name = "accnomos-ledger"
version = "0.1.0"
description = "Append-only double-entry ledger events, projections and the deterministic UK VAT 9-box engine"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/accnomos_ledger"]
