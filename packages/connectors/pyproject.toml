[project]
name = "accnomos-connectors"
version = "0.1.0"
description = "Provider-neutral StorageProvider / MailProvider / CalendarProvider with Microsoft Graph implementations"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "pydantic>=2.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/accnomos_connectors"]
