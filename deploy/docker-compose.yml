# Demo deployment on the DGX Spark (Ollama runs on the host; cloudflared publishes api.accnomos.com).
#   docker compose -f deploy/docker-compose.yml --env-file .env up -d --build
# Nothing here stores user data; the relay holds only the HMRC client secret from .env.
services:
  runtime:
    build: { context: .., dockerfile: deploy/Dockerfile.runtime }
    image: accnomos-runtime
    restart: unless-stopped
    environment:
      OLLAMA_BASE: ${OLLAMA_BASE:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-muse-glimmer:30b}
      MODEL_API_BASE: ${MODEL_API_BASE:-https://api.meta.ai/v1}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://accnomos.com,https://app.accnomos.com,http://localhost:3000}
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:8780:8780"]

  relay:
    build: { context: .., dockerfile: deploy/Dockerfile.relay }
    image: accnomos-relay
    restart: unless-stopped
    environment:
      HMRC_CLIENT_ID: ${HMRC_CLIENT_ID}
      HMRC_CLIENT_SECRET: ${HMRC_CLIENT_SECRET}
      HMRC_BASE: ${HMRC_BASE:-https://test-api.service.hmrc.gov.uk}
      HMRC_AUTH_BASE: ${HMRC_AUTH_BASE:-https://test-www.tax.service.gov.uk}
      HMRC_REDIRECT_URI: ${HMRC_REDIRECT_URI:-https://api.accnomos.com/hmrc/callback}
      HMRC_VENDOR_PRODUCT_NAME: Accnomos
      HMRC_VENDOR_VERSION: ${HMRC_VENDOR_VERSION:-0.1.0}
      RELAY_PUBLIC_IP: ${RELAY_PUBLIC_IP:-}
      RELAY_ALLOWED_REDIRECTS: ${RELAY_ALLOWED_REDIRECTS:-https://accnomos.com,https://app.accnomos.com}
    ports: ["127.0.0.1:8787:8787"]

  # Single public hostname: api.accnomos.com → nginx → /hmrc,/vat → relay; everything else → runtime.
  edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [runtime, relay]
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["127.0.0.1:8790:80"]
