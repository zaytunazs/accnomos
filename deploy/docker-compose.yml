# Demo deployment on the DGX Spark (Ollama runs on the host; cloudflared publishes api.accnomos.com).
#   docker compose -f deploy/docker-compose.yml --env-file .env up -d --build
# Nothing here stores user data; the relay holds only the HMRC client secret from .env.
# Every container: non-root, read-only root filesystem (tmpfs /tmp), no capabilities, no privilege escalation,
# healthcheck. See deploy/README.md.
x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256

services:
  runtime:
    <<: *hardened
    build: { context: .., dockerfile: deploy/Dockerfile.runtime }
    image: accnomos-runtime
    environment:
      OLLAMA_BASE: ${OLLAMA_BASE:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-muse-glimmer:30b}
      MODEL_API_BASE: ${MODEL_API_BASE:-https://api.meta.ai/v1}
      # Base URLs a browser may pick with X-AI-Base-Url (besides the two above); anything else is refused.
      AI_ALLOWED_BASE_URLS: ${AI_ALLOWED_BASE_URLS:-http://192.168.1.176:11434}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://accnomos.com,https://app.accnomos.com,http://localhost:3000}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-60}
      # Signs chat/voice action proposals so they survive a restart (docs/ACTIONS.md). Set in .env; never commit it.
      ACTIONS_SIGNING_KEY: ${ACTIONS_SIGNING_KEY:-}
      BASETEN_API_KEY: ${BASETEN_API_KEY:-}
      VERIFIER: ${VERIFIER:-}
      VERIFIER_MODEL: ${VERIFIER_MODEL:-}
      # Companies House Public Data API key (free; developer.company-information.service.gov.uk). Empty = the
      # company look-up is off (routes answer 503 and the app hides it). Set in .env; never commit it.
      COMPANIES_HOUSE_API_KEY: ${COMPANIES_HOUSE_API_KEY:-}
      # The VAT number check goes through the relay, which holds the HMRC credentials (docs/PRODUCTION.md).
      HMRC_RELAY_URL: ${HMRC_RELAY_URL:-http://relay:8787}
      # Website chat "Ask about Accnomos" (POST /public/chat, app/public_chat.py): Accnomos-only answers from
      # app/public_kb.md on the server's own model (local Glimmer by default, never a visitor's key).
      PUBLIC_CONTACT_EMAIL: ${PUBLIC_CONTACT_EMAIL:-admin@zaytunauk.co.uk}
      PUBLIC_CHAT_PER_MIN: ${PUBLIC_CHAT_PER_MIN:-6}
      PUBLIC_CHAT: ${PUBLIC_CHAT:-on}
    # Uploads over 1 MB spool to /tmp, and ffmpeg converts voice there: 25 MB uploads need the headroom.
    tmpfs: ["/tmp:size=256m,mode=1777"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:8780:8780"]

  relay:
    <<: *hardened
    build: { context: .., dockerfile: deploy/Dockerfile.relay }
    image: accnomos-relay
    environment:
      HMRC_CLIENT_ID: ${HMRC_CLIENT_ID}
      HMRC_CLIENT_SECRET: ${HMRC_CLIENT_SECRET}
      HMRC_BASE: ${HMRC_BASE:-https://test-api.service.hmrc.gov.uk}
      HMRC_AUTH_BASE: ${HMRC_AUTH_BASE:-https://test-www.tax.service.gov.uk}
      HMRC_REDIRECT_URI: ${HMRC_REDIRECT_URI:-https://api.accnomos.com/hmrc/callback}
      HMRC_VENDOR_PRODUCT_NAME: Accnomos
      HMRC_VENDOR_VERSION: ${HMRC_VENDOR_VERSION:-0.1.0}
      RELAY_PUBLIC_IP: ${RELAY_PUBLIC_IP:-}
      RELAY_ALLOWED_REDIRECTS: ${RELAY_ALLOWED_REDIRECTS:-https://accnomos.com,https://app.accnomos.com}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-60}
    tmpfs: ["/tmp:size=16m,mode=1777"]
    ports: ["127.0.0.1:8787:8787"]

  # Single public hostname: api.accnomos.com → nginx → /hmrc,/vat → relay; everything else → runtime.
  edge:
    <<: *hardened
    image: nginxinc/nginx-unprivileged:1.27.2-alpine
    depends_on:
      runtime: { condition: service_healthy }
      relay: { condition: service_healthy }
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    tmpfs: ["/tmp:size=64m,mode=1777"]   # pid file, client body and proxy buffers
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
    ports: ["127.0.0.1:8790:8080"]
