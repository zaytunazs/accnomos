# api.accnomos.com edge: one hostname, two stateless services. Hardening notes: deploy/README.md.
# Internet → Plesk nginx (TLS, sets X-Forwarded-For/X-Client-Port) → reverse SSH tunnel → :8790 → here.
# Runs as nginx-unprivileged (non-root, port 8080, read-only filesystem with tmpfs /tmp).

# The real client address for HMRC fraud-prevention headers and per-IP rate limits. The front proxy appends
# the peer it saw to X-Forwarded-For, so the LAST entry is the one a client cannot forge; anything to its left
# was supplied by the client. Cloudflare appends the visitor address to X-Forwarded-For too, so the same rule
# holds behind cloudflared. CF-Connecting-IP is deliberately NOT trusted (a client can send it on any
# non-Cloudflare path) and is stripped before the services see it.
map $http_x_forwarded_for $client_ip {
    "~(?:^|,)\s*(?<last>[^,\s]+)\s*$" $last;
    default                           $remote_addr;
}
map $http_x_client_port $client_port {
    ""      $remote_port;
    default $http_x_client_port;
}
# Pass on the scheme the front proxy saw (the services refuse credentials over plain http); TLS-only fronts
# (cloudflared) may not set it, so absent means https.
map $http_x_forwarded_proto $forwarded_proto {
    ""      https;
    default $http_x_forwarded_proto;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 256k;          # JSON everywhere; the upload routes below allow more (app/security.py)
    client_body_timeout 30s;
    client_header_timeout 15s;
    large_client_header_buffers 4 16k;  # credential headers are capped at 8 KB by the services

    # Security headers on every response (also errors). add_header must not appear in any location below,
    # or that location silently drops all of these (nginx inheritance).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    proxy_hide_header Server;
    proxy_hide_header X-Powered-By;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Client-Port $client_port;
    proxy_connect_timeout 5s;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ ^/(hmrc|vat)/ {
        proxy_pass http://relay:8787;
        proxy_read_timeout 60s;
    }

    location ~ ^/(extract|books/ask/voice|books/bank/import)$ {
        client_max_body_size 25m;
        proxy_pass http://runtime:8780;
        proxy_read_timeout 300s;   # Glimmer extraction can take 20-60 s per document
    }

    location = /invoices/profile/logo {
        client_max_body_size 2m;   # a 1 MB logo plus its multipart wrapping
        proxy_pass http://runtime:8780;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://runtime:8780;
        proxy_read_timeout 300s;
    }
}
