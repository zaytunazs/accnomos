# api.accnomos.com edge: one hostname, two stateless services.
# Internet → Plesk nginx (TLS, sets X-Forwarded-For/X-Client-Port) → reverse SSH tunnel → :8790 → here.
server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    # Pass the real client address/port through for HMRC fraud-prevention headers. The front proxy
    # (Plesk nginx or Cloudflare) already saw the client; prefer what it forwarded over our own peer,
    # which is just the tunnel endpoint.
    set $client_ip $remote_addr;
    if ($http_x_forwarded_for) { set $client_ip $http_x_forwarded_for; }
    if ($http_cf_connecting_ip) { set $client_ip $http_cf_connecting_ip; }
    set $client_port $remote_port;
    if ($http_x_client_port) { set $client_port $http_x_client_port; }

    location ~ ^/(hmrc|vat)/ {
        proxy_pass http://relay:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Client-Port $client_port;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://runtime:8780;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;   # Glimmer extraction can take 20-60 s per document
    }
}
