# api.accnomos.com edge: one hostname, two stateless services. cloudflared → :8790 → here.
server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    # Pass the real client address/port through for HMRC fraud-prevention headers.
    set $client_ip $remote_addr;
    if ($http_cf_connecting_ip) { set $client_ip $http_cf_connecting_ip; }

    location ~ ^/(hmrc|vat)/ {
        proxy_pass http://relay:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Client-Port $remote_port;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://runtime:8780;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;   # Glimmer extraction can take 20-60 s per document
    }
}
